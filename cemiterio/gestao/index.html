<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16365a">
  <title>VitalPat Cemitério · Gestão</title>
  <link rel="icon" href="icones/icone-vitalpat.svg" type="image/svg+xml">
  <link rel="stylesheet" href="estilo.css">
  <script>
    // Tema escolhido pela pessoa (claro, escuro ou automático = igual ao aparelho). Aplicado antes de desenhar, para não piscar.
    (function () { try { var t = localStorage.getItem('vitalpat-tema'); if (t === 'claro') document.documentElement.dataset.theme = 'light'; else if (t === 'escuro') document.documentElement.dataset.theme = 'dark'; } catch (e) { /* sem preferência guardada */ } })();
  </script>
  <script>
    // Só entra quem fez login com um usuário do cemitério (ver ../../index.html).
    (function () {
      var s = null;
      try { s = JSON.parse(localStorage.getItem('vitalpat-sessao')); } catch (e) { s = null; }
      if (!s || s.sistema !== 'cemiterio') {
        window.VP_SEM_ACESSO = true;
        location.replace('../../index.html' + (s ? '?motivo=sem-acesso' : ''));
      }
    })();
  </script>
</head>
<body>
  <div id="carregando" class="carregando"><img src="icones/logo-vitalpat.svg" alt="VitalPat" width="180"><span>Abrindo…</span></div>
  <header class="topo">
    <button id="abrir-menu" class="botao-icone" aria-label="Abrir menu">☰</button>
    <a href="#painel" class="marca"><img src="icones/logo-vitalpat.svg" alt="VitalPat" width="105" height="34"><span>Cemitério</span></a>
    <span id="modo-sistema" class="modo-sistema"></span>
    <input id="busca-global" type="search" placeholder="Buscar túmulo (código, quadra, número…) e Enter" aria-label="Buscar túmulo">
    <a class="botao pequeno claro link-campo" href="../app-campo/" title="Aplicativo para celular e tablet">Aplicativo de campo</a>
    <button id="tema" class="botao pequeno claro" type="button" title="Mudar entre claro, escuro e automático">Tema: automático</button>
    <button id="sair" class="botao pequeno claro">Sair</button>
  </header>
  <nav id="menu" class="menu" aria-label="Menu principal"></nav>
  <main class="principal">
    <div class="cabeca-tela"><h1 id="titulo-tela"></h1><div id="acoes-tela" class="acoes-tela"></div></div>
    <div id="conteudo"></div>
    <p class="rodape-demo">Demonstração: dados fictícios, guardados só neste navegador.</p>
  </main>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/qrcode.js"></script>
  <script src="vendor/supabase.js"></script>
  <script src="../config-servidor.js"></script>
  <script src="js/base.js"></script>
  <script src="js/calculos.js"></script>
  <script src="js/planilha.js"></script>
  <script src="js/semente.js"></script>
  <script src="js/graficos.js"></script>
  <script src="js/componentes.js"></script>
  <script src="js/telas.js"></script>
  <script src="js/telas-vistorias.js"></script>
  <script src="js/telas-concessoes.js"></script>
  <script src="js/telas-processos.js"></script>
  <script src="js/telas-plaquetas.js"></script>
  <script src="js/telas-mapas.js"></script>
  <script src="js/servidor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
